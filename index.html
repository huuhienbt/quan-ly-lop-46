<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lớp 4/6 - Trường Tiểu học Phú Thọ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="app.js?v=67" defer></script>
</head>
<body class="antialiased bg-slate-50 text-slate-800">

    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-indigo-600 mb-4"></div>
        <p class="font-black text-indigo-900 animate-pulse tracking-widest">ĐANG KẾT NỐI...</p>
    </div>

    <div id="loginScreen" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center fade-in">
            <h1 class="text-3xl font-black text-indigo-900 mb-6">LỚP 4/6</h1>
            
            <input id="inputLogin" type="text" inputmode="numeric" class="w-full p-4 border-2 border-indigo-100 rounded-xl font-bold text-xl text-center mb-4 focus:border-indigo-500 outline-none transition" placeholder="Mật khẩu / SĐT...">
            
            <button onclick="login()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg btn-3d shadow-lg hover:bg-indigo-700">ĐĂNG NHẬP</button>
            <p id="connStatus" class="mt-4 text-xs font-bold text-gray-400">Đang kiểm tra kết nối máy chủ...</p>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen flex flex-col pb-20">
        
        <div class="header-bg text-white sticky top-0 z-40 shadow-lg">
            <div class="px-4 py-3 flex justify-between items-center max-w-5xl mx-auto">
                <div class="flex items-center gap-3 cursor-pointer" onclick="veTrangChu()">
                    <div class="w-10 h-10 bg-white text-indigo-700 rounded-xl flex items-center justify-center font-black text-lg border-2 border-indigo-200 shadow-md">4/6</div>
                    <div><h1 class="font-bold leading-none">TRANG CHỦ</h1><p class="text-[10px] opacity-80 font-bold uppercase">Tiểu học Phú Thọ</p></div>
                </div>
                
                <div class="relative">
                    <div onclick="toggleMenu()" class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/20 transition backdrop-blur-md border border-white/20">
                        <span id="headerName" class="font-bold text-xs hidden sm:block">--</span>
                        <i class="fas fa-user-circle text-2xl"></i>
                    </div>
                    
                    <div id="appMenu" class="hidden absolute top-12 right-0 bg-white text-slate-700 shadow-2xl rounded-xl w-64 border border-slate-100 overflow-hidden z-50 fade-in ring-1 ring-black/5">
                        <div class="bg-slate-50 p-4 border-b">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tài khoản hiện tại</p>
                            <p class="font-black text-slate-800 truncate text-lg" id="menuName">--</p>
                        </div>
                        <div class="p-2 space-y-1 max-h-[60vh] overflow-y-auto">
                            <div id="menuTeacher" class="hidden">
                                <div onclick="chuyenTrangQuanLy()" class="menu-item"><i class="fas fa-users text-blue-600 w-8"></i> QL Học sinh</div>
                                <div onclick="moDonTu()" class="menu-item"><i class="fas fa-envelope-open-text text-red-600 w-8"></i> Hộp thư</div>
                                <div onclick="moTienDo()" class="menu-item"><i class="fas fa-chart-line text-purple-600 w-8"></i> Tiến độ Học tập</div>
                                <div class="border-t my-2"></div>
                                <div onclick="quanLyNganHang('math')" class="menu-item"><i class="fas fa-calculator text-indigo-600 w-8"></i> Kho Toán</div>
                                <div onclick="quanLyNganHang('vietnamese')" class="menu-item"><i class="fas fa-book text-green-600 w-8"></i> Kho Tiếng Việt</div>
                            </div>
                            
                            <div id="menuStudent" class="hidden">
                                <div onclick="alert('Tính năng đang cập nhật'); closeMenu();" class="menu-item"><i class="fas fa-id-card text-yellow-600 w-8"></i> Hồ sơ cá nhân</div>
                                <div onclick="moXinPhep()" class="menu-item"><i class="fas fa-pen-to-square text-red-600 w-8"></i> Gửi đơn xin phép</div>
                            </div>
                        </div>
                        <div class="border-t p-2 bg-slate-50">
                            <div onclick="logout()" class="p-3 hover:bg-red-100 rounded-lg font-bold text-red-600 flex justify-center items-center cursor-pointer transition">
                                <i class="fas fa-sign-out-alt mr-2"></i> Đăng xuất
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="content" class="container mx-auto px-4 pt-6 max-w-5xl fade-in pb-24">
        </div>
    </div>

    <div id="modalProfile" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden transform transition-all scale-100">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fas fa-user-graduate"></i> <span id="pfName">Tên học sinh</span></h3>
                <button onclick="closeModal('modalProfile')" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/40 flex items-center justify-center transition"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="pfContent" class="p-5">
                </div>
            
            <div class="bg-slate-50 p-3 text-center border-t">
                <button onclick="closeModal('modalProfile')" class="text-slate-500 font-bold text-sm hover:text-slate-800">Đóng cửa sổ</button>
            </div>
        </div>
    </div>

    <style>
        .menu-item {
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s;
        }
        .menu-item:hover {
            background-color: #eff6ff;
            color: #2563eb;
            transform: translateX(4px);
        }
    </style>
</body>
</html>
