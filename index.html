<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 4/6 - Next Gen UI (V39)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            background-color: #f0f4f8;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1e293b;
        }

        /* Hiệu ứng Kính mờ (Glassmorphism) */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        
        .glass-dark {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Animation */
        .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hover-lift { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s; }
        .hover-lift:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.15); }
        .hover-lift:active { transform: translateY(-1px) scale(0.98); }

        .game-btn { 
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            border-bottom: 4px solid #cbd5e1;
        }
        .game-btn:active { border-bottom: 0px; transform: translateY(4px); }

        /* Input đẹp */
        .modern-input {
            background: rgba(255,255,255,0.9);
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .modern-input:focus {
            background: white;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    </style>
</head>
<body class="text-sm">

    <div id="loader" class="fixed inset-0 z-[9999] bg-slate-900 flex flex-col items-center justify-center text-white">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-indigo-500 mb-4"></div>
        <p class="font-bold tracking-widest animate-pulse">CONNECTING...</p>
    </div>

    <div id="loginScreen" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl relative overflow-hidden fade-in-up">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-purple-400 rounded-full blur-3xl opacity-30"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-400 rounded-full blur-3xl opacity-30"></div>

            <div class="relative z-10">
                <div class="w-20 h-20 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl text-white shadow-xl mb-6 transform rotate-3">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 mb-1">LỚP HỌC 4/6</h1>
                <p class="text-slate-500 font-semibold mb-8 text-xs uppercase tracking-wide">Trường TH Phú Thọ</p>
                
                <div class="space-y-4">
                    <input id="inputLogin" type="number" class="modern-input w-full p-4 rounded-xl font-bold text-lg text-center text-slate-700" placeholder="Nhập số điện thoại...">
                    <button onclick="xuLyDangNhap()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-indigo-500/30 transition transform active:scale-95">
                        Truy cập ngay
                    </button>
                </div>
                <p class="mt-6 text-[10px] text-slate-400 font-bold">GVCN: Thầy Nguyễn Hữu Hiển</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen pb-20 relative">
        
        <div class="fixed top-4 left-4 right-4 z-40 flex justify-center">
            <div class="glass-dark px-2 py-2 rounded-full shadow-2xl flex justify-between items-center w-full max-w-5xl">
                <div onclick="veTrangChu()" class="flex items-center space-x-3 cursor-pointer pl-2">
                    <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white font-bold shadow-lg">4/6</div>
                    <div class="hidden sm:block">
                        <h1 class="font-bold text-sm leading-tight text-white">Lớp Học Số</h1>
                        <p class="text-[10px] text-indigo-200">Trường TH Phú Thọ</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 pr-1">
                    <div id="studentStats" class="hidden items-center space-x-3 bg-slate-800/50 px-4 py-1.5 rounded-full border border-white/10 mr-2">
                        <div class="flex items-center font-bold text-xs text-yellow-400"><i class="fas fa-gem mr-1.5"></i> <span id="statDiamond">0</span></div>
                        <div class="w-px h-3 bg-white/20"></div>
                        <div class="flex items-center font-bold text-xs text-orange-400"><i class="fas fa-trophy mr-1.5"></i> <span id="statMedal">0</span></div>
                    </div>

                    <div onclick="xuLyClickProfile()" class="flex items-center space-x-2 cursor-pointer bg-slate-700 hover:bg-slate-600 pl-3 pr-1 py-1 rounded-full transition border border-white/10 relative">
                        <p id="headerName" class="text-xs font-bold text-white uppercase hidden sm:block">--</p>
                        <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-white text-xs shadow-md">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>

                    <div id="gvcnMenu" class="hidden absolute top-14 right-0 w-60 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden text-slate-800 transform origin-top-right transition-all">
                        <div class="bg-indigo-50 p-3 border-b border-indigo-100">
                            <p class="text-xs font-black text-indigo-800 uppercase">Menu Giáo Viên</p>
                        </div>
                        <div class="p-1">
                            <button onclick="chuyenTrangQuanLy()" class="w-full text-left px-4 py-3 hover:bg-slate-50 rounded-xl font-bold text-slate-700 flex items-center text-xs"><i class="fas fa-users w-6 text-blue-500"></i> Thông tin học sinh</button>
                            <button onclick="chuyenTrangKetQua()" class="w-full text-left px-4 py-3 hover:bg-slate-50 rounded-xl font-bold text-slate-700 flex items-center text-xs"><i class="fas fa-chart-line w-6 text-yellow-500"></i> Kết quả học tập</button>
                            <div class="h-px bg-slate-100 my-1"></div>
                            <button onclick="dangXuat()" class="w-full text-left px-4 py-3 hover:bg-red-50 rounded-xl font-bold text-red-500 flex items-center text-xs"><i class="fas fa-sign-out-alt w-6"></i> Đăng xuất</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pt-24 px-4 container mx-auto max-w-5xl">
            
            <div id="sectionDashboard" class="fade-in-up">
                <div class="glass p-8 rounded-[2rem] text-center mb-8 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                    <h2 id="welcomeText" class="text-2xl md:text-4xl font-extrabold text-slate-800 mb-2">Xin chào!</h2>
                    <p id="subWelcomeText" class="text-slate-500 font-medium">Sẵn sàng cho bài học hôm nay chưa?</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <button onclick="alert('Đang soạn bài tập Toán...')" class="glass p-6 rounded-3xl hover-lift text-left group relative overflow-hidden h-40 flex items-center justify-between border-l-8 border-blue-500">
                        <div class="z-10">
                            <h3 class="text-2xl font-black text-slate-800 mb-1 group-hover:text-blue-600 transition">TOÁN</h3>
                            <p class="text-xs text-slate-400 font-bold uppercase">Tư duy logic</p>
                        </div>
                        <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition duration-300">
                            <i class="fas fa-calculator"></i>
                        </div>
                        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-400 rounded-full blur-3xl opacity-10 group-hover:opacity-20 transition"></div>
                    </button>

                    <button onclick="alert('Đang soạn bài tập Tiếng Việt...')" class="glass p-6 rounded-3xl hover-lift text-left group relative overflow-hidden h-40 flex items-center justify-between border-l-8 border-green-500">
                        <div class="z-10">
                            <h3 class="text-2xl font-black text-slate-800 mb-1 group-hover:text-green-600 transition">TIẾNG VIỆT</h3>
                            <p class="text-xs text-slate-400 font-bold uppercase">Ngôn ngữ & Cảm xúc</p>
                        </div>
                        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition duration-300">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-green-400 rounded-full blur-3xl opacity-10 group-hover:opacity-20 transition"></div>
                    </button>
                </div>
            </div>

            <div id="sectionManager" class="hidden fade-in-up">
                <div class="glass p-4 rounded-2xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-24 z-30">
                    <div class="flex items-center w-full md:w-auto">
                        <button onclick="veTrangChu()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center mr-4 transition text-slate-600"><i class="fas fa-arrow-left"></i></button>
                        <h2 class="text-lg font-black text-slate-800 uppercase">Hồ sơ lớp</h2>
                    </div>
                    <div class="flex w-full md:w-auto gap-2">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                            <input id="searchInput" onkeyup="locDanhSach()" type="text" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-indigo-500 font-bold text-slate-700 text-xs" placeholder="Tìm tên...">
                        </div>
                        <button onclick="moFormThem()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-indigo-500/30 text-xs whitespace-nowrap"><i class="fas fa-plus mr-1"></i> Thêm</button>
                    </div>
                </div>
                <div id="studentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="sectionResults" class="hidden fade-in-up">
                <div class="glass p-4 rounded-2xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-24 z-30">
                    <div class="flex items-center w-full md:w-auto">
                        <button onclick="veTrangChu()" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center mr-4 transition text-slate-600"><i class="fas fa-arrow-left"></i></button>
                        <h2 class="text-lg font-black text-slate-800 uppercase">Bảng Thành Tích</h2>
                    </div>
                    <div class="relative w-full md:w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
                        <input id="searchResultInput" onkeyup="locDanhSachKetQua()" type="text" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-yellow-500 font-bold text-slate-700 text-xs" placeholder="Tìm tên...">
                    </div>
                </div>
                <div id="resultsGrid" class="grid grid-cols-1 gap-3 max-w-2xl mx-auto"></div>
            </div>

        </div>
    </div>

    <div id="profileModal" class="hidden fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md relative fade-in-up overflow-hidden flex flex-col max-h-[90vh]">
            <button onclick="dongHoSo()" class="absolute top-4 right-4 bg-white/50 hover:bg-white text-slate-600 w-8 h-8 rounded-full flex items-center justify-center z-10 transition backdrop-blur-sm"><i class="fas fa-times"></i></button>
            
            <div id="cardContent" class="overflow-y-auto">
                <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 text-center text-white relative">
                    <button id="btnEditHeader" onclick="batCheDoSua(true)" class="hidden absolute top-4 left-4 bg-white/20 hover:bg-white/40 text-white w-9 h-9 rounded-full backdrop-blur-md flex items-center justify-center transition" title="Sửa"><i class="fas fa-pen text-xs"></i></button>
                    
                    <div class="w-20 h-20 bg-white rounded-full mx-auto p-1 shadow-xl mb-3 mt-2">
                        <div class="w-full h-full rounded-full bg-slate-100 flex items-center justify-center text-3xl text-indigo-500">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                    </div>
                    <h2 id="viewName" class="text-lg font-extrabold uppercase tracking-tight">--</h2>
                    <input id="editName" type="text" class="hidden modern-input text-center text-indigo-900 font-bold mb-2" placeholder="Tên...">
                    <span id="cardID" class="inline-block bg-black/20 px-3 py-0.5 rounded-full text-[10px] font-mono mt-1">--</span>
                </div>

                <div class="p-5 space-y-3 bg-slate-50">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Ngày sinh</p>
                            <p id="viewDob" class="font-bold text-slate-700">--</p>
                            <input id="editDob" type="text" class="hidden modern-input text-center" placeholder="dd/mm/yyyy">
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Giới tính</p>
                            <p id="viewGender" class="font-bold text-slate-700">--</p>
                            <select id="editGender" class="hidden modern-input text-center"><option value="Nam">Nam</option><option value="Nữ">Nữ</option></select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 relative group">
                            <a id="btnCallFather" href="#" class="absolute top-2 right-2 w-7 h-7 bg-green-100 text-green-600 rounded-full flex items-center justify-center hover:bg-green-500 hover:text-white transition"><i class="fas fa-phone text-xs"></i></a>
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Cha</p>
                            <p id="viewFather" class="font-bold text-slate-700 text-sm truncate pr-6">--</p>
                            <input id="editFather" type="number" class="hidden modern-input" placeholder="Số ĐT...">
                        </div>
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 relative group">
                            <a id="btnCallMother" href="#" class="absolute top-2 right-2 w-7 h-7 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center hover:bg-pink-500 hover:text-white transition"><i class="fas fa-phone text-xs"></i></a>
                            <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Mẹ</p>
                            <p id="viewMother" class="font-bold text-slate-700 text-sm truncate pr-6">--</p>
                            <input id="editMother" type="number" class="hidden modern-input" placeholder="Số ĐT...">
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-1">Địa chỉ</p>
                        <p id="viewAddress" class="font-medium text-slate-700 text-sm">--</p>
                        <input id="editAddress" type="text" class="hidden modern-input" placeholder="Nhập địa chỉ...">
                    </div>

                    <div class="bg-yellow-50 p-3 rounded-xl border border-yellow-200">
                        <p class="text-[10px] text-yellow-600 font-bold uppercase mb-1">Ghi chú</p>
                        <p id="viewNote" class="text-slate-600 text-sm italic">--</p>
                        <textarea id="editNote" class="hidden modern-input h-20" placeholder="Ghi chú..."></textarea>
                    </div>
                </div>

                <div class="p-4 bg-white border-t border-slate-100">
                    <div id="savePanel" class="hidden flex gap-3">
                        <button onclick="batCheDoSua(false)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-3 rounded-xl font-bold transition">Hủy</button>
                        <button onclick="luuThayDoi()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/30 transition">Lưu Lại</button>
                    </div>

                    <button id="btnDeleteFooter" onclick="xoaHS()" class="hidden w-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white py-3 rounded-xl font-bold transition text-xs uppercase tracking-wider">
                        <i class="fas fa-trash-alt mr-2"></i> Xóa hồ sơ này
                    </button>

                    <button id="btnLogoutModal" onclick="dangXuat()" class="hidden w-full text-slate-400 hover:text-red-500 py-2 font-bold text-xs transition">
                        Đăng xuất tài khoản
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwePkzMhFSKMbeHZuzPCvfcfztbdrt716FJOwm34Ja99wKUy3XQdA_23d1ByzS745QnLQ/exec"; 
        const PASS_ADMIN = "123456";
        let dsHocSinh = []; 
        let currentHS = null;
        let isAdmin = false;

        window.onload = async function() {
            await taiDanhSach();
            const savedRole = localStorage.getItem('userRole');
            if (savedRole === 'admin') vaoGiaoDienAdmin();
            else if (savedRole === 'student') {
                const savedID = localStorage.getItem('studentID');
                const hs = dsHocSinh.find(h => h.id === savedID);
                if(hs) vaoGiaoDienHocSinh(hs); else showLogin();
            } else showLogin();
        };

        function showLogin() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        async function taiDanhSach() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (typeof data === 'string' && data.includes("LỖI")) { alert(data); } else { dsHocSinh = data; }
            } catch (err) { 
                document.getElementById('loader').innerText = "Lỗi kết nối! Kiểm tra lại mạng hoặc link Apps Script.";
            }
        }

        function xuLyDangNhap() {
            const input = document.getElementById('inputLogin').value.trim();
            if(!input) return alert("Vui lòng nhập thông tin!");
            if (input === PASS_ADMIN) { localStorage.setItem('userRole', 'admin'); vaoGiaoDienAdmin(); return; }
            const hsTimThay = dsHocSinh.find(hs => (hs.fatherPhone && hs.fatherPhone.toString().includes(input)) || (hs.motherPhone && hs.motherPhone.toString().includes(input)));
            if (hsTimThay) { localStorage.setItem('userRole', 'student'); localStorage.setItem('studentID', hsTimThay.id); vaoGiaoDienHocSinh(hsTimThay); } 
            else { alert("Số điện thoại chưa đúng!"); }
        }

        function vaoGiaoDienAdmin() {
            isAdmin = true;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('headerName').innerText = "Thầy Hiển";
            document.getElementById('welcomeText').innerText = "Chào Thầy, chúc một ngày dạy tốt!";
            document.getElementById('studentStats').style.display = 'none'; 
            document.getElementById('subWelcomeText').style.display = 'none'; 
            veDanhSachQuanLy(dsHocSinh);
        }

        function vaoGiaoDienHocSinh(hs) {
            isAdmin = false;
            currentHS = hs;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('headerName').innerText = hs.name;
            document.getElementById('welcomeText').innerText = `Chào ${hs.name}, hôm nay con học gì?`;
            document.getElementById('studentStats').style.display = 'flex'; 
            document.getElementById('subWelcomeText').style.display = 'block'; 
            const diamonds = parseInt(hs.score) || 0;
            const medals = Math.floor(diamonds / 100);
            document.getElementById('statDiamond').innerText = diamonds;
            document.getElementById('statMedal').innerText = medals;
        }

        function xuLyClickProfile() {
            if(isAdmin) {
                const menu = document.getElementById('gvcnMenu');
                menu.classList.toggle('hidden');
            } else {
                if(currentHS) { dienThongTinVaoModal(currentHS); document.getElementById('profileModal').classList.remove('hidden'); }
            }
        }

        function chuyenTrangQuanLy() { anTatCaSection(); document.getElementById('sectionManager').classList.remove('hidden'); veDanhSachQuanLy(dsHocSinh); }
        function chuyenTrangKetQua() { anTatCaSection(); document.getElementById('sectionResults').classList.remove('hidden'); veDanhSachKetQua(dsHocSinh); }
        function veTrangChu() { anTatCaSection(); document.getElementById('sectionDashboard').classList.remove('hidden'); }
        function anTatCaSection() {
            document.getElementById('gvcnMenu').classList.add('hidden');
            document.getElementById('sectionDashboard').classList.add('hidden');
            document.getElementById('sectionManager').classList.add('hidden');
            document.getElementById('sectionResults').classList.add('hidden');
        }

        function veDanhSachQuanLy(data) {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = "";
            data.forEach(hs => {
                grid.innerHTML += `
                <div onclick="xemChiTietTuQuanLy('${hs.id}')" class="glass p-4 rounded-2xl hover-lift cursor-pointer flex items-center space-x-4">
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-400 to-indigo-500 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-lg">${hs.name.charAt(0)}</div>
                    <div class="flex-1 overflow-hidden">
                        <h3 class="font-bold text-slate-800 text-sm truncate">${hs.name}</h3>
                        <p class="text-xs text-slate-500 font-mono mt-0.5">${hs.id}</p>
                    </div>
                    <div class="text-slate-300"><i class="fas fa-chevron-right"></i></div>
                </div>`;
            });
        }

        function veDanhSachKetQua(data) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = "";
            const sorted = [...data].sort((a,b) => (b.score || 0) - (a.score || 0));
            sorted.forEach((hs, index) => {
                const diamonds = parseInt(hs.score) || 0;
                const medals = Math.floor(diamonds / 100);
                let rankColor = index === 0 ? "bg-yellow-400 text-white shadow-yellow-200" : index === 1 ? "bg-slate-300 text-slate-600" : index === 2 ? "bg-orange-400 text-white" : "bg-slate-100 text-slate-500";
                
                grid.innerHTML += `
                <div class="glass p-3 rounded-xl flex items-center justify-between hover-lift">
                    <div class="flex items-center space-x-4 flex-1">
                        <div class="w-8 h-8 ${rankColor} rounded-full flex items-center justify-center font-black text-sm shadow-md">${index + 1}</div>
                        <div><h3 class="font-bold text-slate-800 text-sm">${hs.name}</h3></div>
                    </div>
                    <div class="flex items-center space-x-3 bg-slate-50 px-3 py-1 rounded-lg border border-slate-100">
                        <button onclick="suaDiem('${hs.id}', -10)" class="w-6 h-6 hover:bg-slate-200 rounded text-slate-400 font-bold transition">-</button>
                        <div class="text-center w-12"><div class="text-[10px] text-yellow-500 font-bold"><i class="fas fa-gem"></i></div><span class="font-black text-indigo-900 text-base">${diamonds}</span></div>
                        <button onclick="suaDiem('${hs.id}', 10)" class="w-6 h-6 hover:bg-slate-200 rounded text-slate-400 font-bold transition">+</button>
                        <div class="w-px h-6 bg-slate-200"></div>
                        <div class="text-center w-8"><div class="text-[10px] text-orange-400 font-bold"><i class="fas fa-trophy"></i></div><span class="font-bold text-slate-600 text-sm">${medals}</span></div>
                    </div>
                </div>`;
            });
        }

        function locDanhSach() { const key = document.getElementById('searchInput').value.toLowerCase(); veDanhSachQuanLy(dsHocSinh.filter(hs => hs.name.toLowerCase().includes(key))); }
        function locDanhSachKetQua() { const key = document.getElementById('searchResultInput').value.toLowerCase(); veDanhSachKetQua(dsHocSinh.filter(hs => hs.name.toLowerCase().includes(key))); }
        function xemChiTietTuQuanLy(id) { const hs = dsHocSinh.find(h => h.id === id); if(hs) { dienThongTinVaoModal(hs); document.getElementById('profileModal').classList.remove('hidden'); } }
        function suaDiem(id, delta) { if(!isAdmin) return; const hs = dsHocSinh.find(h => h.id === id); if(hs) { let newScore = (parseInt(hs.score) || 0) + delta; if(newScore < 0) newScore = 0; hs.score = newScore; veDanhSachKetQua(dsHocSinh); guiYeuCau("sua", hs); } }
        function dongHoSo() { document.getElementById('profileModal').classList.add('hidden'); batCheDoSua(false); }
        
        function dienThongTinVaoModal(hs) { 
            currentHS = hs; 
            const safe = (val) => (val && val !== "undefined") ? val : ""; 
            document.getElementById('viewName').innerText = safe(hs.name); document.getElementById('cardID').innerText = safe(hs.id); document.getElementById('viewDob').innerText = xuLyNgay(hs.dob) || "-"; document.getElementById('viewGender').innerText = safe(hs.gender) || "-"; document.getElementById('viewFather').innerText = safe(hs.fatherPhone) || "---"; document.getElementById('viewMother').innerText = safe(hs.motherPhone) || "---"; document.getElementById('viewAddress').innerText = safe(hs.address) || "---"; document.getElementById('viewNote').innerText = safe(hs.note) || "Không"; document.getElementById('btnCallFather').href = "tel:" + safe(hs.fatherPhone); document.getElementById('btnCallMother').href = "tel:" + safe(hs.motherPhone); 
            
            if(isAdmin) {
                document.getElementById('btnEditHeader').classList.remove('hidden');
                document.getElementById('btnDeleteFooter').classList.remove('hidden');
                document.getElementById('btnLogoutModal').classList.add('hidden'); 
                document.getElementById('savePanel').classList.add('hidden');
            } else {
                document.getElementById('btnEditHeader').classList.add('hidden');
                document.getElementById('btnDeleteFooter').classList.add('hidden');
                document.getElementById('btnLogoutModal').classList.remove('hidden'); 
                document.getElementById('savePanel').classList.add('hidden');
            }
        }
        function xuLyNgay(str) { if (!str) return ""; if (str.toString().includes("T")) { try { return new Date(str).toLocaleDateString('vi-VN'); } catch (e) {} } return str; }
        
        function batCheDoSua(enable) {
            if(!currentHS || !isAdmin) return;
            const fields = ['Name', 'Dob', 'Gender', 'Father', 'Mother', 'Address', 'Note'];
            if (enable) {
                document.getElementById('editName').value = currentHS.name; document.getElementById('editDob').value = xuLyNgay(currentHS.dob); document.getElementById('editGender').value = currentHS.gender; document.getElementById('editFather').value = currentHS.fatherPhone; document.getElementById('editMother').value = currentHS.motherPhone; document.getElementById('editAddress').value = currentHS.address; document.getElementById('editNote').value = currentHS.note;
                fields.forEach(f => { document.getElementById('view' + f).classList.add('hidden'); document.getElementById('edit' + f).classList.remove('hidden'); });
                document.getElementById('btnEditHeader').classList.add('hidden');
                document.getElementById('btnDeleteFooter').classList.add('hidden');
                document.getElementById('savePanel').classList.remove('hidden');
            } else {
                fields.forEach(f => { document.getElementById('view' + f).classList.remove('hidden'); document.getElementById('edit' + f).classList.add('hidden'); });
                document.getElementById('btnEditHeader').classList.remove('hidden');
                document.getElementById('btnDeleteFooter').classList.remove('hidden');
                document.getElementById('savePanel').classList.add('hidden');
            }
        }

        function luuThayDoi() { if(!isAdmin) return; let hsMoi = { id: currentHS.id, name: document.getElementById('editName').value, dob: document.getElementById('editDob').value, gender: document.getElementById('editGender').value, fatherPhone: document.getElementById('editFather').value, motherPhone: document.getElementById('editMother').value, address: document.getElementById('editAddress').value, note: document.getElementById('editNote').value, score: currentHS.score }; guiYeuCau("sua", hsMoi); }
        function moFormThem() { if(!isAdmin) return; let ten = prompt("Nhập Họ và Tên HS mới:"); if(!ten) return; let hsMoi = { id: "HS" + Date.now(), name: ten, dob: "", gender: "Nam", fatherPhone: "", motherPhone: "", address: "", note: "", score: 0 }; guiYeuCau("them", hsMoi); }
        function xoaHS() { if(!isAdmin) return; if(confirm("CẢNH BÁO: Thầy có chắc chắn muốn XÓA hồ sơ này không?")) guiYeuCau("xoa", {id: currentHS.id}); }
        function dangXuat() { if(confirm("Bạn muốn đăng xuất?")) { localStorage.removeItem('userRole'); localStorage.removeItem('studentID'); location.reload(); } }
        async function guiYeuCau(action, data) { try { await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: action, data: data}) }); if(action !== 'sua' || document.getElementById('profileModal').classList.contains('hidden') === false) { setTimeout(async () => { alert("Thành công!"); await taiDanhSach(); if(action === 'sua') { veDanhSachQuanLy(dsHocSinh); dienThongTinVaoModal(dsHocSinh.find(h => h.id === data.id)); } else location.reload(); }, 1500); } } catch(e) { alert("Lỗi kết nối Server!"); } }
    </script>
</body>
</html>
