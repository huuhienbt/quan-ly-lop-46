<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Lớp 4/6 (V8 - Fix Lỗi Ngày Sinh)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .edit-input { 
            border: 2px solid #3b82f6; background-color: #eff6ff; 
            padding: 4px 8px; border-radius: 6px; width: 100%; 
            color: #1e3a8a; font-weight: bold; transition: all 0.2s;
        }
        .edit-input:focus { outline: none; border-color: #f59e0b; background-color: white; box-shadow: 0 0 5px rgba(245, 158, 11, 0.5); }
    </style>
</head>
<body class="bg-gray-100 font-sans text-sm min-h-screen pb-20">

    <div class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50 border-b-4 border-yellow-500 flex justify-between items-center">
        <h1 class="text-lg font-bold uppercase tracking-wider"><i class="fas fa-search mr-2"></i> Tra Cứu HS</h1>
        <div>
            <button id="btnLogin" onclick="dangNhap()" class="bg-yellow-500 text-blue-900 px-3 py-1 rounded font-bold hover:bg-yellow-400 text-xs shadow transition">
                <i class="fas fa-user-lock mr-1"></i> Admin
            </button>
            <div id="userArea" class="hidden flex items-center space-x-3">
                <span class="bg-blue-800 px-3 py-1 rounded-full text-xs font-bold border border-blue-600 shadow-inner">
                    <i class="fas fa-user-tie mr-1 text-yellow-400"></i> GVCN
                </span>
                <button onclick="dangXuat()" class="bg-red-600 text-white px-3 py-1 rounded font-bold hover:bg-red-500 text-xs shadow transition" title="Đăng xuất">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container mx-auto mt-6 p-4 max-w-2xl">
        
        <div class="bg-white p-5 rounded-xl shadow-sm mb-6">
            <div id="panelThem" class="hidden mb-4">
                 <button onclick="moFormThem()" class="w-full bg-green-600 text-white py-3 rounded-lg shadow hover:bg-green-700 font-bold uppercase transition flex justify-center items-center transform active:scale-95">
                    <i class="fas fa-plus-circle mr-2 text-xl"></i> Thêm Học Sinh Mới
                </button>
                <div class="border-b border-gray-100 my-4"></div>
            </div>

            <label class="block text-gray-500 text-xs font-bold mb-2 uppercase tracking-wide">Chọn học sinh:</label>
            <div class="relative">
                <select id="selectHS" onchange="hienChiTiet()" class="block appearance-none w-full bg-gray-50 border border-gray-300 text-gray-800 py-3 px-4 pr-8 rounded-lg focus:outline-none focus:bg-white focus:border-blue-500 font-bold text-lg shadow-sm">
                    <option value="">-- Đang tải danh sách... --</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            <p id="loadingText" class="text-xs text-center text-gray-400 mt-2 italic">Đang kết nối dữ liệu...</p>
        </div>

        <div id="infoCard" class="hidden bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200 fade-in relative transition-all">
            <div class="bg-gradient-to-r from-blue-600 to-blue-500 p-6 text-center text-white relative">
                <div class="w-20 h-20 bg-white rounded-full mx-auto flex items-center justify-center text-4xl text-blue-500 shadow-lg border-4 border-blue-200">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <div class="mt-3">
                    <h2 id="viewName" class="text-2xl font-bold uppercase tracking-wide block">--</h2>
                    <input id="editName" type="text" class="hidden text-center text-blue-900 font-bold text-xl p-2 rounded w-3/4 mx-auto" placeholder="Nhập tên...">
                </div>
                <span id="cardID" class="text-blue-100 text-xs font-mono bg-blue-800 px-2 py-0.5 rounded-full bg-opacity-50">--</span>
                
                <div id="adminControls" class="hidden absolute top-4 right-4 flex flex-col space-y-2">
                    <button id="btnEditMode" onclick="batCheDoSua(true)" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 p-2 rounded-full shadow transition" title="Bật chế độ sửa">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button id="btnDelete" onclick="xoaHS()" class="bg-red-500 hover:bg-red-400 text-white p-2 rounded-full shadow transition" title="Xóa học sinh">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="p-6 space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Ngày sinh</p>
                        <p id="viewDob" class="font-bold text-gray-800 text-base block">--</p>
                        <input id="editDob" type="text" class="hidden edit-input text-center" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 text-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Giới tính</p>
                        <p id="viewGender" class="font-bold text-gray-800 text-base block">--</p>
                        <select id="editGender" class="hidden edit-input text-center">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center">
                                <div class="bg-blue-500 text-white w-6 h-6 rounded-full flex items-center justify-center mr-2 text-xs"><i class="fas fa-male"></i></div>
                                <span class="text-[10px] text-blue-800 font-bold uppercase">ĐT Cha</span>
                            </div>
                            <a id="btnCallFather" href="#" class="text-blue-600 hover:text-blue-800"><i class="fas fa-phone-alt"></i></a>
                        </div>
                        <p id="viewFather" class="font-bold text-blue-900 text-lg ml-8 block">--</p>
                        <input id="editFather" type="number" class="hidden edit-input ml-8 w-[80%]" placeholder="Số ĐT...">
                    </div>

                    <div class="bg-pink-50 p-3 rounded-lg border border-pink-100">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center">
                                <div class="bg-pink-500 text-white w-6 h-6 rounded-full flex items-center justify-center mr-2 text-xs"><i class="fas fa-female"></i></div>
                                <span class="text-[10px] text-pink-800 font-bold uppercase">ĐT Mẹ</span>
                            </div>
                            <a id="btnCallMother" href="#" class="text-pink-600 hover:text-pink-800"><i class="fas fa-phone-alt"></i></a>
                        </div>
                        <p id="viewMother" class="font-bold text-pink-900 text-lg ml-8 block">--</p>
                        <input id="editMother" type="number" class="hidden edit-input ml-8 w-[80%]" placeholder="Số ĐT...">
                    </div>
                </div>

                <div class="border-t border-gray-100"></div>

                <div>
                    <p class="text-[10px] text-gray-400 uppercase font-bold mb-1"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> Chỗ ở</p>
                    <p id="viewAddress" class="text-gray-800 font-medium ml-1 block">--</p>
                    <input id="editAddress" type="text" class="hidden edit-input" placeholder="Nhập địa chỉ...">
                </div>

                <div class="bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                    <p class="text-[10px] text-yellow-700 uppercase font-bold mb-1"><i class="fas fa-sticky-note mr-1"></i> Ghi chú</p>
                    <p id="viewNote" class="text-gray-700 italic ml-1 text-sm block">--</p>
                    <textarea id="editNote" class="hidden edit-input h-20" placeholder="Nhập ghi chú..."></textarea>
                </div>
            </div>

            <div id="savePanel" class="hidden p-4 bg-gray-50 border-t border-gray-200 flex space-x-3 animate-pulse">
                <button onclick="batCheDoSua(false)" class="flex-1 bg-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-400 transition">Hủy</button>
                <button onclick="luuThayDoi()" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow-lg transition">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwePkzMhFSKMbeHZuzPCvfcfztbdrt716FJOwm34Ja99wKUy3XQdA_23d1ByzS745QnLQ/exec"; 
        const PASS_ADMIN = "123456";
        let isAdmin = false;
        let dsHocSinh = []; 
        let currentHS = null;

        // --- HÀM MỚI: XỬ LÝ NGÀY THÁNG ---
        function xuLyNgay(str) {
            if (!str) return "";
            // Nếu chuỗi có chứa chữ T và Z (định dạng ISO)
            if (str.toString().includes("T") && str.toString().includes("Z")) {
                try {
                    let d = new Date(str);
                    // Chuyển sang định dạng VN: ngày/tháng/năm
                    return d.toLocaleDateString('vi-VN');
                } catch (e) { return str; }
            }
            return str; // Nếu là chữ thường thì trả về nguyên vẹn
        }

        function checkLoginState() {
            if (localStorage.getItem('isGVCN') === 'true') {
                isAdmin = true;
                capNhatGiaoDienAdmin();
            }
        }

        async function taiDanhSach() {
            const select = document.getElementById('selectHS');
            const loading = document.getElementById('loadingText');
            try {
                const res = await fetch(API_URL);
                dsHocSinh = await res.json();
                loading.innerText = "Đã tải xong " + dsHocSinh.length + " học sinh.";
                loading.className = "text-xs text-center text-green-600 mt-2 font-bold";
                select.innerHTML = '<option value="">-- Chọn tên học sinh --</option>';
                dsHocSinh.forEach((hs, index) => select.innerHTML += `<option value="${index}">${index+1}. ${hs.name}</option>`);
            } catch (err) { loading.innerText = "Lỗi kết nối!"; }
        }

        function hienChiTiet() {
            batCheDoSua(false); 
            const index = document.getElementById('selectHS').value;
            const card = document.getElementById('infoCard');
            if (index === "") { card.classList.add('hidden'); currentHS = null; return; }

            const hs = dsHocSinh[index];
            currentHS = hs;
            const safe = (val) => (val && val !== "undefined") ? val : "";

            document.getElementById('viewName').innerText = safe(hs.name) || "Chưa có tên";
            document.getElementById('cardID').innerText = safe(hs.id);
            
            // SỬ DỤNG HÀM XỬ LÝ NGÀY Ở ĐÂY
            document.getElementById('viewDob').innerText = xuLyNgay(hs.dob) || "-";
            
            document.getElementById('viewGender').innerText = safe(hs.gender) || "-";
            document.getElementById('viewFather').innerText = safe(hs.fatherPhone) || "---";
            document.getElementById('viewMother').innerText = safe(hs.motherPhone) || "---";
            document.getElementById('viewAddress').innerText = safe(hs.address) || "Chưa cập nhật";
            document.getElementById('viewNote').innerText = safe(hs.note) || "Không";

            document.getElementById('btnCallFather').href = "tel:" + safe(hs.fatherPhone);
            document.getElementById('btnCallMother').href = "tel:" + safe(hs.motherPhone);

            card.classList.remove('hidden');
            if(isAdmin) document.getElementById('adminControls').classList.remove('hidden');
            else document.getElementById('adminControls').classList.add('hidden');
        }

        function batCheDoSua(enable) {
            if(!currentHS) return;
            const fields = ['Name', 'Dob', 'Gender', 'Father', 'Mother', 'Address', 'Note'];
            if (enable) {
                document.getElementById('editName').value = currentHS.name;
                
                // KHI SỬA CŨNG PHẢI XỬ LÝ NGÀY CHO ĐẸP
                document.getElementById('editDob').value = xuLyNgay(currentHS.dob);
                
                document.getElementById('editGender').value = currentHS.gender;
                document.getElementById('editFather').value = currentHS.fatherPhone;
                document.getElementById('editMother').value = currentHS.motherPhone;
                document.getElementById('editAddress').value = currentHS.address;
                document.getElementById('editNote').value = currentHS.note;

                fields.forEach(f => {
                    document.getElementById('view' + f).classList.add('hidden');
                    document.getElementById('edit' + f).classList.remove('hidden');
                });
                document.getElementById('adminControls').classList.add('hidden');
                document.getElementById('savePanel').classList.remove('hidden');
            } else {
                fields.forEach(f => {
                    document.getElementById('view' + f).classList.remove('hidden');
                    document.getElementById('edit' + f).classList.add('hidden');
                });
                if(isAdmin) document.getElementById('adminControls').classList.remove('hidden');
                document.getElementById('savePanel').classList.add('hidden');
            }
        }

        function luuThayDoi() {
            let hsMoi = {
                id: currentHS.id,
                name: document.getElementById('editName').value,
                dob: document.getElementById('editDob').value,
                gender: document.getElementById('editGender').value,
                fatherPhone: document.getElementById('editFather').value,
                motherPhone: document.getElementById('editMother').value,
                address: document.getElementById('editAddress').value,
                note: document.getElementById('editNote').value
            };
            guiYeuCau("sua", hsMoi);
        }

        function moFormThem() {
            let ten = prompt("Nhập Họ và Tên HS mới:"); if(!ten) return;
            let hsMoi = { id: "HS" + Date.now(), name: ten, dob: "", gender: "Nam", fatherPhone: "", motherPhone: "", address: "", note: "" };
            guiYeuCau("them", hsMoi);
        }

        function xoaHS() {
            if(confirm("Xóa em " + currentHS.name + "?")) guiYeuCau("xoa", {id: currentHS.id});
        }

        async function guiYeuCau(action, data) {
            document.getElementById('loadingText').innerText = "Đang lưu...";
            await fetch(API_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({action: action, data: data})
            });

            setTimeout(async () => {
                if (action === 'xoa') { alert("Đã xóa!"); location.reload(); return; }
                await taiDanhSach();
                
                // Tự động tìm và hiện lại đúng học sinh vừa sửa
                const idCanTim = data.id;
                const index = dsHocSinh.findIndex(hs => hs.id === idCanTim);
                
                if (index !== -1) {
                    document.getElementById('selectHS').value = index;
                    hienChiTiet();
                    alert("Đã lưu thành công!");
                } else { location.reload(); }
            }, 1500);
        }

        function dangNhap() {
            let pass = prompt("Nhập mật khẩu GVCN:");
            if (pass === PASS_ADMIN) {
                isAdmin = true;
                localStorage.setItem('isGVCN', 'true');
                capNhatGiaoDienAdmin();
                alert("Xin chào thầy Hiển!");
            } else if (pass) alert("Sai mật khẩu!");
        }

        function dangXuat() {
            if(confirm("Thầy có muốn đăng xuất?")) {
                isAdmin = false;
                localStorage.removeItem('isGVCN');
                location.reload();
            }
        }

        function capNhatGiaoDienAdmin() {
            document.getElementById('btnLogin').classList.add('hidden');
            document.getElementById('userArea').classList.remove('hidden');
            document.getElementById('panelThem').classList.remove('hidden');
            if(currentHS) document.getElementById('adminControls').classList.remove('hidden');
        }

        checkLoginState();
        taiDanhSach();
    </script>
</body>
</html>
