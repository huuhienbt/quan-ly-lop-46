<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Góc Học Tập - Lớp Bốn 6</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-3d:active { transform: translateY(2px); box-shadow: none; }
        /* Tùy chỉnh thanh cuộn đẹp mắt */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body class="bg-[#f8fafc] font-sans text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <body class="bg-[#f8fafc] font-sans text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div id="particle-container"></div>
    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm transition-opacity duration-300">
        <div class="rainbow-spinner mb-5"></div>

    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm transition-opacity duration-300">
        <div class="rainbow-spinner mb-5"></div>
        <p class="font-black text-indigo-600 tracking-widest animate-pulse text-lg">ĐANG KẾT NỐI HỆ THỐNG...</p>
        <p id="connStatus" class="mt-2 text-sm font-bold text-slate-400">Đang tải dữ liệu lớp học</p>
    </div>

    <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-blue-50 relative overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-delay: 2s;"></div>
        
        <div class="bg-white p-8 sm:p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md relative z-10 border border-white">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-4xl shadow-lg transform rotate-3 mb-4">
                    <i class="fas fa-school -rotate-3"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 mb-1 uppercase tracking-wide">Đăng Nhập</h2>
                <p class="text-sm font-bold text-slate-500">Hệ thống học tập Lớp Bốn 6</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-black text-slate-400 uppercase tracking-wider block mb-2 ml-1">Số điện thoại / Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-phone text-slate-400 text-lg"></i>
                        </div>
                        <input type="tel" id="inputLogin" class="w-full bg-slate-50 border-2 border-slate-100 pl-12 pr-4 py-4 rounded-2xl font-bold text-slate-700 outline-none focus:border-indigo-500 focus:bg-white transition-all shadow-inner text-lg" placeholder="Nhập vào đây..." onkeypress="if(event.key === 'Enter') window.login()">
                    </div>
                </div>
                <button onclick="window.login()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:shadow-indigo-500/30 hover:scale-[1.02] transition-all duration-200 btn-3d">
                    VÀO LỚP NGAY <i class="fas fa-arrow-right ml-2"></i>
                </button>
                <button onclick="window.loginGuest()" class="w-full mt-2 text-slate-400 font-bold text-sm hover:text-indigo-600 transition flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i> Vào xem với tư cách Khách
                </button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen flex flex-col max-w-5xl mx-auto">
        
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-4 sm:px-6 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="window.veTrangChu()">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-xl flex items-center justify-center text-white text-xl sm:text-2xl shadow-md group-hover:scale-105 transition">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl text-slate-800 leading-tight">LỚP BỐN 6</h1>
                    <p class="text-[10px] sm:text-xs font-bold text-indigo-600 uppercase tracking-widest">TRƯỜNG TIỂU HỌC PHÚ THỌ</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3 cursor-pointer group" onclick="window.toggleMenu()">
                <div class="hidden sm:flex flex-col items-end mr-1">
                    <span id="headerRole" class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Tài khoản</span>
                    <span id="headerName" class="font-bold text-slate-700 text-sm group-hover:text-indigo-600 transition">Chưa đăng nhập</span>
                </div>

                <button class="relative w-10 h-10 sm:w-12 sm:h-12 bg-white border-2 border-slate-100 rounded-full flex items-center justify-center text-slate-600 group-hover:border-indigo-400 group-hover:shadow-[0_0_15px_rgba(99,102,241,0.3)] transition-all overflow-hidden p-0 shadow-sm">
                    <i id="menuIcon" class="fas fa-bars text-lg transition-opacity"></i>
                    <img id="headerAvatarImg" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                </button>
            </div>
        </header>

        <div id="appMenu" class="hidden fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm transition-opacity">
            <div class="absolute right-0 top-0 bottom-0 w-72 sm:w-80 bg-white shadow-2xl animate-[slideInRight_0.3s_ease-out] flex flex-col">
                <div class="p-6 bg-gradient-to-br from-indigo-600 to-blue-700 text-white relative">
                    <button onclick="window.closeMenu()" class="absolute top-4 right-4 w-8 h-8 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/40 transition">
                        <i class="fas fa-times"></i>
                    </button>
                    <div id="menuSideAvatar" class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center text-3xl text-indigo-600 shadow-inner mb-4 overflow-hidden">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h3 id="menuName" class="font-black text-xl mb-1">Chưa đăng nhập</h3>
                    <p class="text-indigo-200 text-xs font-bold uppercase tracking-wider" id="menuRoleText">Khách truy cập</p>
                </div>
                
                <div class="p-4 flex-1 overflow-y-auto space-y-1 custom-scrollbar">
                    <div id="menuStudent" class="space-y-1"></div>
                    <div id="menuTeacher" class="space-y-1 hidden"></div>
                </div>
                
                <div class="p-4 border-t border-slate-100">
                    <button onclick="window.logout()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 transition flex items-center justify-center gap-2">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </div>
            </div>
        </div>

        <main class="flex-1 p-4 sm:p-6 lg:p-8 w-full relative">
            
            <div id="content" class="w-full"></div>

            <div class="mt-12 mb-6 text-center w-full fade-in opacity-80">
                <p class="text-sm font-black text-slate-500 uppercase tracking-wide">
                   <i class="fas fa-school mr-1"></i> Lớp Bốn 6 - Trường Tiểu học Phú Thọ
                </p>
                <p class="text-[12px] font-bold text-slate-400 mt-1 uppercase tracking-widest">
                    Năm học 2025 - 2026
                </p>
            </div>
            
        </main>
    </div>

    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="features.js"></script>
    <script src="background-effect.js"></script>
    
</body>
</html>
