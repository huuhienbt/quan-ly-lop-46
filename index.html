<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lớp 4/6 (Full)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-50 font-sans text-sm">

    <div class="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold uppercase"><i class="fas fa-school mr-2"></i> Lớp 4/6</h1>
            <div>
                 <button onclick="taiLaiDuLieu()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded mr-2 transition">
                    <i class="fas fa-sync-alt"></i> Tải lại
                </button>
                <button id="btnAdmin" onclick="dangNhap()" class="bg-white text-blue-800 px-3 py-1 rounded font-bold hover:bg-gray-200 transition">
                    <i class="fas fa-user-lock"></i> Admin
                </button>
            </div>
        </div>
    </div>

    <div class="container mx-auto mt-6 p-2">
        <div id="statusMsg" class="hidden text-center p-2 mb-4 rounded bg-yellow-100 text-yellow-800">
            <i class="fas fa-spinner fa-spin mr-2"></i> Đang xử lý...
        </div>

        <div id="adminPanel" class="hidden mb-4 flex justify-end">
            <button onclick="moFormThem()" class="bg-green-600 text-white px-5 py-2 rounded-lg shadow hover:bg-green-700 font-bold transition flex items-center">
                <i class="fas fa-user-plus mr-2"></i> Thêm Học Sinh
            </button>
        </div>

        <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 uppercase text-xs font-bold border-b-2 border-gray-300">
                            <th class="py-3 px-3 text-left w-12">#</th>
                            <th class="py-3 px-3 text-left">Họ và Tên</th>
                            <th class="py-3 px-3 text-center w-24">Ngày Sinh</th>
                            <th class="py-3 px-3 text-center w-16">Nam/Nữ</th>
                            <th class="py-3 px-3 text-center w-28 text-blue-700">Cha</th>
                            <th class="py-3 px-3 text-center w-28 text-pink-700">Mẹ</th>
                            <th class="py-3 px-3 text-left">Chỗ ở hiện nay</th>
                            <th class="py-3 px-3 text-left w-24">Ghi chú</th>
                            <th class="py-3 px-3 text-center w-16">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-gray-700 bg-white">
                        </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden p-10 text-center text-gray-400">
                <i class="fas fa-folder-open text-4xl mb-2"></i>
                <p>Chưa có dữ liệu nào.</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        const API_URL = "DÁN_LINK_VÀO_ĐÂY"; // <--- DÁN LINK API CỦA THẦY VÀO ĐÂY
        // ============================================

        const PASS_ADMIN = "123456";
        let isAdmin = false;

        async function taiLaiDuLieu() {
            hienThongBao(true, "Đang tải dữ liệu...");
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                veBang(data);
                hienThongBao(false);
            } catch (err) { alert("Lỗi: " + err); hienThongBao(false); }
        }

        function veBang(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            if(!list || list.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            list.forEach((hs, index) => {
                let nutXoa = isAdmin ? 
                    `<button onclick="xoaHS('${hs.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded transition"><i class="fas fa-trash-alt"></i></button>` : '';

                let row = `
                    <tr class="border-b border-gray-100 hover:bg-blue-50 transition duration-150">
                        <td class="p-3 font-mono text-xs text-gray-400">${index+1}</td>
                        <td class="p-3 font-bold text-gray-800">${hs.name}</td>
                        <td class="p-3 text-center">${hs.dob}</td>
                        <td class="p-3 text-center">
                            <span class="${hs.gender==='Nam'?'text-blue-600 bg-blue-100':'text-pink-600 bg-pink-100'} px-2 py-1 rounded text-xs font-bold">${hs.gender}</span>
                        </td>
                        <td class="p-3 text-center font-medium text-gray-600">${hs.fatherPhone}</td>
                        <td class="p-3 text-center font-medium text-gray-600">${hs.motherPhone}</td>
                        <td class="p-3 text-gray-700"><i class="fas fa-map-marker-alt text-red-400 mr-1 text-xs"></i>${hs.address}</td>
                        <td class="p-3 italic text-gray-400 text-xs truncate max-w-[100px]" title="${hs.note}">${hs.note}</td>
                        <td class="p-3 text-center">${nutXoa}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function moFormThem() {
            // Hỏi lần lượt từng câu
            let ten = prompt("1. Nhập Họ và Tên:"); if(!ten) return;
            let dob = prompt("2. Ngày sinh (dd/mm/yyyy):") || "";
            let gender = prompt("3. Giới tính (Nam/Nữ):") || "Nam";
            let father = prompt("4. SĐT Cha:") || "";
            let mother = prompt("5. SĐT Mẹ:") || "";
            let addr = prompt("6. Chỗ ở hiện nay (Thôn/Xóm):") || "";
            let note = prompt("7. Ghi chú thêm:") || "";

            let hsMoi = {
                id: "HS" + Date.now(), // Tạo ID theo thời gian thực để không trùng
                name: ten, dob: dob, gender: gender,
                fatherPhone: father, motherPhone: mother,
                address: addr, note: note
            };

            guiYeuCau("them", hsMoi);
        }

        function xoaHS(id) {
            if(confirm("Thầy có chắc muốn xóa học sinh này không?")) guiYeuCau("xoa", {id: id});
        }

        async function guiYeuCau(action, data) {
            hienThongBao(true, "Đang gửi lên Google Sheet...");
            await fetch(API_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({action: action, data: data})
            });
            setTimeout(() => { 
                hienThongBao(false); 
                alert("Xong!"); 
                taiLaiDuLieu(); 
            }, 2000);
        }

        function hienThongBao(show, msg="") {
            const el = document.getElementById('statusMsg');
            if(show) { el.classList.remove('hidden'); el.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${msg}`; }
            else el.classList.add('hidden');
        }

        function dangNhap() {
            if(!isAdmin) {
                if(prompt("Mật khẩu Admin:") === PASS_ADMIN) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('btnAdmin').classList.add('hidden'); 
                    taiLaiDuLieu(); 
                } else alert("Mật khẩu sai!");
            }
        }
        
        taiLaiDuLieu();
    </script>
</body>
</html>
