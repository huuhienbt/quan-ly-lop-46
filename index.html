<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lớp 4/6 - V68 Siêu Tốc</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="antialiased">

    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-indigo-600 mb-4"></div>
        <p class="font-black text-indigo-900 animate-pulse tracking-widest">ĐANG KẾT NỐI...</p>
    </div>

    <div id="loginScreen" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center fade-in">
            <h1 class="text-3xl font-black text-indigo-900 mb-6">LỚP 4/6</h1>
            <input id="inputLogin" type="number" class="w-full p-4 border-2 border-indigo-100 rounded-xl font-bold text-xl text-center mb-4 focus:border-indigo-500 outline-none transition" placeholder="Mật khẩu / SĐT...">
            <button onclick="login()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold text-lg btn-3d">ĐĂNG NHẬP</button>
            <p id="connStatus" class="mt-4 text-xs font-bold text-gray-400">Kiểm tra kết nối...</p>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen flex flex-col pb-20">
        <div class="header-bg text-white sticky top-0 z-40 shadow-lg">
            <div class="px-4 py-3 flex justify-between items-center max-w-5xl mx-auto">
                <div class="flex items-center gap-3 cursor-pointer" onclick="veTrangChu()">
                    <div class="w-10 h-10 bg-white text-indigo-700 rounded-xl flex items-center justify-center font-black text-lg border-2 border-indigo-200">4/6</div>
                    <div><h1 class="font-bold leading-none">TRANG CHỦ</h1><p class="text-[10px] opacity-80 font-bold uppercase">Tiểu học Phú Thọ</p></div>
                </div>
                <div class="relative">
                    <div onclick="toggleMenu()" class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/20 transition">
                        <span id="headerName" class="font-bold text-xs hidden sm:block">--</span>
                        <i class="fas fa-user-circle text-2xl"></i>
                    </div>
                    
                    <div id="appMenu" class="hidden absolute top-12 right-0 bg-white text-slate-700 shadow-xl rounded-xl w-60 border border-slate-100 overflow-hidden z-50 fade-in">
                        <div class="bg-slate-50 p-3 border-b"><p class="text-xs font-bold text-slate-400 uppercase">Tài khoản</p><p class="font-black text-slate-800 truncate" id="menuName">--</p></div>
                        <div class="p-2 space-y-1">
                            <div id="menuTeacher" class="hidden">
                                <div onclick="chuyenTrangQuanLy()" class="p-3 hover:bg-blue-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-users text-blue-600 w-6"></i> QL Học sinh</div>
                                <div onclick="moDonTu()" class="p-3 hover:bg-red-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-envelope-open-text text-red-600 w-6"></i> Hộp thư Đơn từ</div>
                                <div onclick="moTienDo()" class="p-3 hover:bg-purple-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-chart-line text-purple-600 w-6"></i> Tiến độ Học tập</div>
                                <div onclick="quanLyNganHang('math')" class="p-3 hover:bg-indigo-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-calculator text-indigo-600 w-6"></i> Kho Toán</div>
                                <div onclick="quanLyNganHang('vietnamese')" class="p-3 hover:bg-green-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-book text-green-600 w-6"></i> Kho Tiếng Việt</div>
                            </div>
                            <div id="menuStudent" class="hidden">
                                <div onclick="alert('Tính năng đang cập nhật'); closeMenu();" class="p-3 hover:bg-yellow-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-id-card text-yellow-600 w-6"></i> Hồ sơ</div>
                                <div onclick="moXinPhep()" class="p-3 hover:bg-red-50 rounded-lg font-bold flex items-center gap-3 cursor-pointer"><i class="fas fa-pen-to-square text-red-600 w-6"></i> Xin nghỉ</div>
                            </div>
                        </div>
                        <div class="border-t p-2"><div onclick="logout()" class="p-3 hover:bg-red-50 rounded-lg font-bold text-red-500 flex justify-center items-center cursor-pointer"><i class="fas fa-sign-out-alt mr-2"></i> Đăng xuất</div></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="content" class="container mx-auto px-4 pt-6 max-w-5xl fade-in">
            </div>
    </div>
</body>
</html>
