<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lớp 4/6 (Hoàn Thiện)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-100 font-sans text-sm">

    <div class="bg-blue-900 text-white p-4 shadow-lg sticky top-0 z-50 border-b-4 border-yellow-500">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold uppercase tracking-wider"><i class="fas fa-graduation-cap mr-2"></i> Lớp 4/6 - Thầy Hiển</h1>
            <div>
                 <button onclick="taiLaiDuLieu()" class="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2 rounded shadow transition">
                    <i class="fas fa-sync-alt"></i> Tải lại
                </button>
                <button id="btnAdmin" onclick="dangNhap()" class="bg-yellow-500 text-blue-900 px-4 py-2 rounded font-bold hover:bg-yellow-400 shadow ml-2 transition">
                    <i class="fas fa-user-lock"></i> Admin
                </button>
            </div>
        </div>
    </div>

    <div class="container mx-auto mt-8 p-2 max-w-7xl">
        
        <div id="statusMsg" class="hidden text-center p-3 mb-6 rounded bg-yellow-100 text-yellow-800 shadow">
            <i class="fas fa-spinner fa-spin mr-2"></i> Đang xử lý dữ liệu...
        </div>

        <div id="adminPanel" class="hidden mb-6 flex justify-end">
            <button onclick="moFormThem()" class="bg-green-600 text-white px-6 py-2 rounded-lg shadow-lg hover:bg-green-700 font-bold transition flex items-center transform hover:scale-105">
                <i class="fas fa-user-plus mr-2"></i> Thêm Học Sinh
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
            
            <div class="bg-blue-800 p-4 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-white font-bold text-lg uppercase">
                    <i class="fas fa-address-card mr-2 text-yellow-400"></i> Thông Tin Học Sinh
                </h2>
                <span class="text-blue-200 text-xs italic">Dữ liệu từ Google Sheet</span>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 uppercase text-xs font-bold border-b-2 border-gray-200">
                            <th class="py-4 px-4 text-left w-12">#</th>
                            <th class="py-4 px-4 text-left">Họ và Tên</th>
                            <th class="py-4 px-4 text-center w-28">Ngày Sinh</th>
                            <th class="py-4 px-4 text-center w-20">Giới Tính</th>
                            <th class="py-4 px-4 text-center w-32 text-blue-700"><i class="fas fa-phone-alt mr-1"></i> ĐT Cha</th>
                            <th class="py-4 px-4 text-center w-32 text-pink-700"><i class="fas fa-phone-alt mr-1"></i> ĐT Mẹ</th>
                            <th class="py-4 px-4 text-left">Chỗ ở hiện nay</th>
                            <th class="py-4 px-4 text-left w-32">Ghi chú</th>
                            <th class="py-4 px-4 text-center w-20">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-gray-700 bg-white">
                        </tbody>
                </table>
            </div>

            <div id="emptyState" class="hidden p-12 text-center text-gray-400">
                <i class="fas fa-folder-open text-5xl mb-4 text-gray-300"></i>
                <p class="text-lg">Danh sách đang trống hoặc chưa tải xong.</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // HÃY DÁN LINK API CỦA THẦY VÀO DÒNG DƯỚI (Trong dấu ngoặc kép)
        const API_URL = "https://script.google.com/macros/library/d/1-y7Hrf_YhL3MmBaZy6uxzcGJFH2B8KgkeI6dh3DO0bFLsgaGl_C3Cp1n/3"; 
        // ============================================

        const PASS_ADMIN = "123456";
        let isAdmin = false;

        async function taiLaiDuLieu() {
            hienThongBao(true, "Đang kết nối Google Sheet...");
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                veBang(data);
                hienThongBao(false);
            } catch (err) { 
                alert("Lỗi tải dữ liệu. Vui lòng kiểm tra lại Link API!"); 
                console.error(err);
                hienThongBao(false); 
            }
        }

        function veBang(list) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            if(!list || list.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            list.forEach((hs, index) => {
                let nutXoa = isAdmin ? 
                    `<button onclick="xoaHS('${hs.id}')" class="text-red-500 hover:bg-red-100 p-2 rounded-full transition shadow-sm border border-red-200"><i class="fas fa-trash-alt"></i></button>` : '';

                // Xử lý hiển thị undefined cho đẹp
                const safe = (val) => (val && val !== "undefined") ? val : "-";

                let row = `
                    <tr class="border-b border-gray-100 hover:bg-blue-50 transition duration-150 group">
                        <td class="p-4 font-mono text-xs text-gray-400 font-bold">${index+1}</td>
                        <td class="p-4 font-bold text-gray-800 text-base group-hover:text-blue-800">${safe(hs.name)}</td>
                        <td class="p-4 text-center font-medium">${safe(hs.dob)}</td>
                        <td class="p-4 text-center">
                            <span class="${hs.gender==='Nam'?'text-blue-700 bg-blue-100 border border-blue-200':'text-pink-700 bg-pink-100 border border-pink-200'} px-3 py-1 rounded-full text-xs font-bold shadow-sm">${safe(hs.gender)}</span>
                        </td>
                        <td class="p-4 text-center font-bold text-gray-600 font-mono tracking-tighter">${safe(hs.fatherPhone)}</td>
                        <td class="p-4 text-center font-bold text-gray-600 font-mono tracking-tighter">${safe(hs.motherPhone)}</td>
                        <td class="p-4 text-gray-700"><i class="fas fa-map-marker-alt text-red-500 mr-2 opacity-50"></i>${safe(hs.address)}</td>
                        <td class="p-4 italic text-gray-400 text-xs truncate max-w-[150px]" title="${safe(hs.note)}">${safe(hs.note)}</td>
                        <td class="p-4 text-center">${nutXoa}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function moFormThem() {
            let ten = prompt("1. Nhập Họ và Tên:"); if(!ten) return;
            
            let hsMoi = {
                id: "HS" + Date.now(),
                name: ten,
                dob: prompt("2. Ngày sinh (dd/mm/yyyy):") || "",
                gender: prompt("3. Giới tính (Nam/Nữ):") || "Nam",
                fatherPhone: prompt("4. SĐT Cha:") || "",
                motherPhone: prompt("5. SĐT Mẹ:") || "",
                address: prompt("6. Chỗ ở hiện nay:") || "",
                note: prompt("7. Ghi chú:") || ""
            };

            guiYeuCau("them", hsMoi);
        }

        function xoaHS(id) {
            if(confirm("Xác nhận xóa học sinh này khỏi danh sách?")) guiYeuCau("xoa", {id: id});
        }

        async function guiYeuCau(action, data) {
            hienThongBao(true, "Đang lưu thay đổi...");
            await fetch(API_URL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({action: action, data: data})
            });
            setTimeout(() => { 
                hienThongBao(false); 
                alert("Thao tác thành công!"); 
                taiLaiDuLieu(); 
            }, 1500);
        }

        function hienThongBao(show, msg="") {
            const el = document.getElementById('statusMsg');
            if(show) { el.classList.remove('hidden'); el.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${msg}`; }
            else el.classList.add('hidden');
        }

        function dangNhap() {
            if(!isAdmin) {
                let pass = prompt("Nhập mật khẩu Admin:");
                if(pass === PASS_ADMIN) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('btnAdmin').classList.add('hidden'); 
                    taiLaiDuLieu(); 
                    alert("Đã mở khóa quyền Admin!");
                } else if(pass) {
                    alert("Sai mật khẩu!");
                }
            }
        }
        
        // Tự động tải khi mở web
        taiLaiDuLieu();
    </script>
</body>
</html>
